# ─── htool Website → GitHub Pages ──────────────────────────
# Builds the Next.js static site and deploys it to GitHub Pages.
# Requires NO secrets — uses the built-in GITHUB_TOKEN.
# Site URL: https://<owner>.github.io/hacker_toolkit/
# ───────────────────────────────────────────────────────────

name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build (with project base path)
        working-directory: website
        env:
          NEXT_PUBLIC_BASE_PATH: /hacker_toolkit
        run: npm run build

      - name: Disable Jekyll processing
        run: touch website/out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
